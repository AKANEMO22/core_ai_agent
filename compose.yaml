name: dpl-pvan

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    environment:
      APP_ENV: development
      PRODUCT_MODE: practice
      JWT_SECRET: ${DOCKER_JWT_SECRET:-local-compose-development-secret-change-before-production}
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT_BASE: /data/workspaces
      RETRIEVAL_BACKEND: ${DPL_RETRIEVAL_BACKEND:-rag}
      RAG_DATA_DIR: /app/data
      RAG_INDEX_PATH: /data/rag/index.db
      RAG_EMBEDDING_PROVIDER: lsa
      # Empty by default: the app uses its scripted local provider and makes no LLM API calls.
      # Set DOCKER_LLM_API_KEY (and optionally DOCKER_LLM_API_URL / DOCKER_LLM_MODEL) to opt in.
      LLM_API_KEY: ${DOCKER_LLM_API_KEY:-}
      LLM_API_URL: ${DOCKER_LLM_API_URL:-}
      LLM_MODEL: ${DOCKER_LLM_MODEL:-}
    ports:
      - "127.0.0.1:${DPL_PVAN_PORT:-8001}:8000"
    volumes:
      - interview_workspaces:/data/workspaces
      - rag_index:/data/rag
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    init: true
    restart: unless-stopped

volumes:
  redis_data:
  interview_workspaces:
  rag_index:
