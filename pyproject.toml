[project]
name = "ai-interview-core-engine"
version = "0.1.0"
description = "AI Mock Interview Platform Core Runtime Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyjwt>=2.8.0",
    "openai>=1.40.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "websockets>=12.0",
    "numpy>=2.1.0",
    "scipy>=1.14.1",
    "rank-bm25>=0.2.2",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
rag-neural = ["sentence-transformers>=5.0.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.23.0",
    "anyio>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "config", "core", "rag"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "skills"
"config/agent_profiles.json" = "config/agent_profiles.json"
"data/interview_frameworks.json" = "data/interview_frameworks.json"
